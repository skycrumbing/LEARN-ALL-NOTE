<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrowLive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e74c3c"/>
    </marker>
    <marker id="arrowZero" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3498db"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <rect x="0" y="0" width="700" height="42" rx="6" fill="#2c3e50"/>
  <text x="350" y="28" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">变压器输出 — 正常情况</text>

  <!-- 变压器 -->
  <rect x="40" y="80" width="120" height="130" rx="8" fill="#f0f0f0" stroke="#555" stroke-width="2"/>
  <text x="100" y="120" font-size="13" fill="#333" text-anchor="middle">变压器</text>
  <text x="100" y="142" font-size="11" fill="#666" text-anchor="middle">Transformer</text>

  <!-- 变压器线圈符号 -->
  <circle cx="75" cy="170" r="14" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
  <circle cx="100" cy="170" r="14" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
  <circle cx="125" cy="170" r="14" fill="none" stroke="#e74c3c" stroke-width="2.5"/>

  <circle cx="75" cy="185" r="14" fill="none" stroke="#3498db" stroke-width="2.5"/>
  <circle cx="100" cy="185" r="14" fill="none" stroke="#3498db" stroke-width="2.5"/>
  <circle cx="125" cy="185" r="14" fill="none" stroke="#3498db" stroke-width="2.5"/>

  <!-- 火线 -->
  <line x1="160" y1="163" x2="500" y2="163" stroke="#e74c3c" stroke-width="3.5"/>
  <rect x="430" y="146" width="80" height="30" rx="5" fill="#e74c3c"/>
  <text x="470" y="167" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">220V</text>
  <text x="320" y="152" font-size="13" fill="#e74c3c" text-anchor="middle" font-weight="bold">火线 L</text>

  <!-- 零线 -->
  <line x1="160" y1="195" x2="500" y2="195" stroke="#3498db" stroke-width="3.5"/>
  <rect x="430" y="180" width="80" height="30" rx="5" fill="#3498db"/>
  <text x="470" y="201" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">0V</text>
  <text x="320" y="230" font-size="13" fill="#3498db" text-anchor="middle" font-weight="bold">零线 N</text>

  <!-- 电压差标注 -->
  <line x1="545" y1="163" x2="545" y2="195" stroke="#f39c12" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="560" y="176" font-size="11" fill="#f39c12" font-weight="bold">电压差</text>
  <text x="560" y="190" font-size="11" fill="#f39c12" font-weight="bold">220V</text>

  <!-- 接地符号 -->
  <line x1="200" y1="195" x2="200" y2="270" stroke="#3498db" stroke-width="2.5"/>
  <line x1="180" y1="270" x2="220" y2="270" stroke="#3498db" stroke-width="3"/>
  <line x1="185" y1="278" x2="215" y2="278" stroke="#3498db" stroke-width="2.5"/>
  <line x1="190" y1="286" x2="210" y2="286" stroke="#3498db" stroke-width="2"/>
  <text x="235" y="275" font-size="11" fill="#333">零线接地</text>
  <text x="235" y="290" font-size="11" fill="#333">= 0V 参考点</text>
  <text x="200" y="310" font-size="12" fill="#e67e22" text-anchor="middle" font-weight="bold">⚡ 零线因接地而安全</text>

  <!-- 大地 -->
  <rect x="0" y="340" width="700" height="40" fill="#7cb342" opacity="0.3"/>
  <text x="350" y="365" font-size="14" fill="#33691e" text-anchor="middle" font-weight="bold">大 地（0V）</text>
</svg>
