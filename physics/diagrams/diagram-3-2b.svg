<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e74c3c"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3498db"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <rect x="0" y="0" width="900" height="42" rx="6" fill="#c0392b"/>
  <text x="450" y="28" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">⚠️ 零线断开后 — 电器侧零线变成 220V！</text>

  <!-- 变压器 -->
  <rect x="40" y="90" width="120" height="180" rx="8" fill="#f0f0f0" stroke="#555" stroke-width="2"/>
  <text x="100" y="125" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">变压器</text>
  <text x="100" y="145" font-size="11" fill="#666" text-anchor="middle">中性点接地</text>

  <!-- 接地符号 -->
  <line x1="100" y1="270" x2="100" y2="310" stroke="#27ae60" stroke-width="3"/>
  <line x1="80" y1="310" x2="120" y2="310" stroke="#27ae60" stroke-width="3"/>
  <line x1="85" y1="318" x2="115" y2="318" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="90" y1="326" x2="110" y2="326" stroke="#27ae60" stroke-width="2"/>
  <text x="100" y="348" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="bold">= 0V 参考</text>

  <!-- 火线（断开后无电流，无方向箭头） -->
  <line x1="160" y1="140" x2="770" y2="140" stroke="#e74c3c" stroke-width="3.5"/>
  <text x="465" y="128" font-size="13" fill="#e74c3c" text-anchor="middle" font-weight="bold">火线 220V</text>

  <!-- 零线(0V) 变压器侧 -->
  <line x1="160" y1="195" x2="400" y2="195" stroke="#3498db" stroke-width="3.5"/>
  <text x="280" y="216" font-size="13" fill="#3498db" text-anchor="middle" font-weight="bold">零线 0V</text>
  <text x="280" y="232" font-size="10" fill="#3498db" text-anchor="middle">（仍连接接地）</text>

  <!-- 断开点 -->
  <rect x="400" y="160" width="150" height="70" rx="6" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="6,4"/>
  <line x1="420" y1="175" x2="530" y2="220" stroke="#e74c3c" stroke-width="4"/>
  <line x1="420" y1="220" x2="530" y2="175" stroke="#e74c3c" stroke-width="4"/>
  <text x="475" y="155" font-size="13" fill="#e74c3c" text-anchor="middle" font-weight="bold">✂ 断开点</text>

  <!-- 零线(220V!) 电器侧 -->
  <line x1="550" y1="195" x2="770" y2="195" stroke="#e74c3c" stroke-width="3.5"/>
  <text x="660" y="216" font-size="13" fill="#e74c3c" text-anchor="middle" font-weight="bold">零线 220V!</text>
  <text x="660" y="232" font-size="10" fill="#e74c3c" text-anchor="middle">（通过电器连到火线）</text>

  <!-- 电器 -->
  <rect x="770" y="105" width="110" height="120" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="825" y="140" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">电器</text>
  <circle cx="790" cy="170" r="10" fill="none" stroke="#555"/>
  <circle cx="860" cy="170" r="10" fill="none" stroke="#555"/>
  <line x1="785" y1="165" x2="785" y2="175" stroke="#555" stroke-width="1.5"/>
  <line x1="795" y1="165" x2="795" y2="175" stroke="#555" stroke-width="1.5"/>
  <line x1="855" y1="165" x2="855" y2="175" stroke="#555" stroke-width="1.5"/>
  <line x1="865" y1="165" x2="865" y2="175" stroke="#555" stroke-width="1.5"/>
  <text x="825" y="195" font-size="10" fill="#888" text-anchor="middle">插座</text>

  <!-- 断开后电流 = 0 -->
  <rect x="380" y="260" width="190" height="50" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="475" y="278" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="bold">回路断开</text>
  <text x="475" y="298" font-size="11" fill="#e67e22" text-anchor="middle">电流 = 0</text>

  <!-- 电器侧为什么是 220V -->
  <rect x="600" y="260" width="280" height="120" rx="8" fill="#fdf2f2" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="740" y="282" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">为什么电器侧零线 = 220V？</text>
  <text x="740" y="304" font-size="10" fill="#333" text-anchor="middle">① 回路断开 → 电流 = 0</text>
  <text x="740" y="322" font-size="10" fill="#333" text-anchor="middle">② 电流 = 0 → 电器两端无电压差</text>
  <text x="740" y="340" font-size="10" fill="#333" text-anchor="middle">③ 电器零线端 = 火线端 = 220V</text>
  <text x="740" y="362" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="bold">→ 整段零线变成 220V！</text>

  <!-- 变压器侧为什么是 0V -->
  <rect x="180" y="260" width="180" height="50" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/>
  <text x="270" y="278" font-size="11" fill="#1e8449" text-anchor="middle" font-weight="bold">变压器侧</text>
  <text x="270" y="298" font-size="11" fill="#1e8449" text-anchor="middle">仍接地 = 0V ✓</text>

  <!-- 大地 -->
  <rect x="0" y="390" width="900" height="30" fill="#7cb342" opacity="0.3"/>
  <text x="450" y="410" font-size="12" fill="#33691e" text-anchor="middle" font-weight="bold">大 地（0V）</text>

  <!-- 触电箭头 -->
  <rect x="700" y="55" width="180" height="42" rx="6" fill="#fff3cd" stroke="#f39c12" stroke-width="1.5"/>
  <text x="790" y="70" font-size="10" fill="#e67e22" text-anchor="middle">触碰电器侧零线</text>
  <text x="790" y="88" font-size="13" fill="#e74c3c" text-anchor="middle" font-weight="bold">= 触电！</text>
  <line x1="790" y1="97" x2="790" y2="135" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="3,2"/>
</svg>
