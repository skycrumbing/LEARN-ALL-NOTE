<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="380" fill="#FAFBFC" rx="12"/>

  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">环量理论 (Circulation)：气流速度的本质</text>

  <g transform="translate(450,200)">
    <!-- 翼型 -->
    <path d="M -140,0 C -140,-32 -70,-52 0,-45 C 70,-38 110,-22 140,0 C 110,15 70,22 0,20 C -70,18 -140,10 -140,0 Z"
          fill="#4A90D9" stroke="#2C5F8A" stroke-width="2.5"/>

    <!-- 顺时针环量圆 -->
    <g stroke="#F39C12" stroke-width="2" fill="none">
      <ellipse cx="0" cy="0" rx="90" ry="90" stroke-dasharray="5,3"/>
    </g>
    <!-- 环量箭头 -->
    <g fill="#F39C12" stroke="none">
      <polygon points="-90,-10 -105,-2 -92,10"/>
      <polygon points="90,10 105,2 92,-10"/>
    </g>
    <text x="60" y="-70" font-size="12" fill="#F39C12" font-weight="bold">顺时针环量</text>

    <!-- 上方：来流 + 环量 → 加速 -->
    <g stroke="#E74C3C" stroke-width="2" fill="none" opacity="0.85">
      <path d="M -200,-45 C -150,-75 -80,-85 0,-80 C 80,-75 150,-70 200,-65" stroke-dasharray="5,3"/>
      <path d="M -200,-70 C -150,-100 -80,-110 0,-105 C 80,-100 150,-95 200,-90" stroke-dasharray="5,3"/>
    </g>
    <g fill="#E74C3C">
      <polygon points="195,-65 207,-65 197,-57"/>
      <polygon points="195,-90 207,-90 197,-82"/>
    </g>

    <text x="-170" y="-95" font-size="11" fill="#1A1A2E">来流 v₀</text>
    <text x="-100" y="-105" font-size="11" fill="#F39C12">+ 环量</text>
    <text x="120" y="-50" font-size="12" font-weight="bold" fill="#E74C3C">= v₀ + Δv（加速）</text>

    <!-- 下方：来流 - 环量 → 减速 -->
    <g stroke="#2ECC71" stroke-width="2" fill="none" opacity="0.85">
      <path d="M -200,45 C -150,60 -80,70 0,65 C 80,60 150,55 200,50" stroke-dasharray="4,4"/>
      <path d="M -200,70 C -150,85 -80,90 0,85 C 80,80 150,75 200,70" stroke-dasharray="4,4"/>
    </g>
    <g fill="#2ECC71">
      <polygon points="195,50 207,52 197,45"/>
      <polygon points="195,70 207,72 197,65"/>
    </g>

    <text x="-170" y="110" font-size="11" fill="#1A1A2E">来流 v₀</text>
    <text x="-100" y="120" font-size="11" fill="#F39C12">- 环量</text>
    <text x="120" y="90" font-size="12" font-weight="bold" fill="#2ECC71">= v₀ - Δv（减速）</text>
  </g>

  <rect x="80" y="320" width="740" height="50" rx="8" fill="#EEF2F7"/>
  <text x="450" y="345" text-anchor="middle" font-size="13" fill="#1A1A2E">机翼产生顺时针环量：上方气流与环量同向叠加 → 加速；下方反向相减 → 减速</text>
  <text x="450" y="363" text-anchor="middle" font-size="13" fill="#1A1A2E">Circulation adds to freestream on top (faster) and subtracts on bottom (slower)</text>
</svg>