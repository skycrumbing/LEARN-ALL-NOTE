<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="800" height="320" fill="#FAFBFC" rx="12"/>

  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">翼型截面（Airfoil Cross-section）</text>

  <g transform="translate(400,170)">
    <!-- 翼型 -->
    <path d="M -180,0 C -180,-42 -90,-78 0,-68 C 90,-58 150,-35 180,0 C 150,20 90,30 0,28 C -90,26 -180,16 -180,0 Z"
          fill="#4A90D9" stroke="#2C5F8A" stroke-width="2.5"/>

    <!-- 弦长标注线 -->
    <line x1="-180" y1="50" x2="180" y2="50" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="-180" y1="44" x2="-180" y2="56" stroke="#888" stroke-width="1.2"/>
    <line x1="180" y1="44" x2="180" y2="56" stroke="#888" stroke-width="1.2"/>
    <text x="0" y="70" text-anchor="middle" font-size="13" fill="#555">弦长 (Chord)</text>

    <!-- 上表面气流（快，红色） -->
    <g stroke="#E74C3C" stroke-width="1.8" fill="none" opacity="0.85">
      <path d="M -200,-35 C -120,-90 0,-100 100,-75 C 150,-60 180,-45 210,-30" stroke-dasharray="6,3"/>
      <path d="M -200,-60 C -120,-110 0,-120 100,-95 C 150,-80 180,-65 210,-50" stroke-dasharray="6,3"/>
    </g>
    <g fill="#E74C3C">
      <polygon points="206,-30 218,-28 208,-22"/>
      <polygon points="206,-50 218,-48 208,-42"/>
    </g>

    <!-- 下表面气流（慢，绿色） -->
    <g stroke="#2ECC71" stroke-width="1.8" fill="none" opacity="0.85">
      <path d="M -200,20 C -120,10 0,5 100,10 C 150,15 180,20 210,25" stroke-dasharray="4,4"/>
      <path d="M -200,40 C -120,30 0,25 100,30 C 150,35 180,40 210,45" stroke-dasharray="4,4"/>
    </g>
    <g fill="#2ECC71">
      <polygon points="206,25 218,30 208,20"/>
      <polygon points="206,45 218,50 208,40"/>
    </g>

    <!-- 上表面标注 -->
    <text x="-140" y="-90" font-size="12" fill="#E74C3C" font-weight="bold">上表面</text>
    <text x="-140" y="-74" font-size="11" fill="#E74C3C">曲率大 · 气流快</text>

    <!-- 下表面标注 -->
    <text x="-140" y="82" font-size="12" fill="#2ECC71" font-weight="bold">下表面</text>
    <text x="-140" y="98" font-size="11" fill="#2ECC71">曲率小 · 气流慢</text>
  </g>

  <rect x="80" y="260" width="640" height="45" rx="8" fill="#EEF2F7"/>
  <text x="400" y="283" text-anchor="middle" font-size="13" fill="#1A1A2E">上表面路径弯曲 → 气流被压缩加速 → 压强降低</text>
  <text x="400" y="299" text-anchor="middle" font-size="13" fill="#1A1A2E">下表面相对平坦 → 气流速度较低 → 压强较高 → 产生升力</text>
</svg>