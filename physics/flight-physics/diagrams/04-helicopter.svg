<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="600" fill="#FAFBFC" rx="12"/>

  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">直升机：旋翼升力与反扭矩</text>

  <!-- 直升机主体 -->
  <g transform="translate(450,300)">
    <!-- 旋翼 -->
    <line x1="-200" y1="-100" x2="200" y2="-100" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <line x1="-180" y1="-80" x2="180" y2="-80" stroke="#333" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <line x1="-160" y1="-60" x2="160" y2="-60" stroke="#333" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

    <!-- 旋翼毂 -->
    <circle cx="0" cy="-100" r="8" fill="#333"/>

    <!-- 旋转方向 -->
    <g fill="none" stroke="#4A90D9" stroke-width="1.5">
      <path d="M -130,-100 A 130,130 0 0 1 0,-230" stroke-dasharray="5,3"/>
      <polygon points="-130,-98 -145,-105 -135,-90" fill="#4A90D9" stroke="none"/>
    </g>
    <text x="-160" y="-160" font-size="12" fill="#4A90D9">逆时针旋转</text>

    <!-- 机身 -->
    <path d="M -60,-90 L 60,-90 L 80,-60 L 100,0 L 80,40 L 60,70 L -60,70 L -80,40 L -100,0 L -80,-60 Z"
          fill="#4A90D9" stroke="#2C5F8A" stroke-width="2"/>

    <!-- 座舱窗 -->
    <path d="M -30,-75 L 30,-75 L 35,-50 L -35,-50 Z" fill="#A8D5F2" stroke="#2C5F8A" stroke-width="1"/>

    <!-- 尾梁 -->
    <path d="M 80,0 L 200,-10 L 210,0 L 200,10 L 80,15 Z" fill="#4A90D9" stroke="#2C5F8A" stroke-width="2"/>

    <!-- 尾桨 -->
    <line x1="205" y1="-40" x2="205" y2="40" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <line x1="185" y1="-35" x2="225" y2="-35" stroke="#333" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="185" y1="-20" x2="225" y2="-20" stroke="#333" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <line x1="185" y1="0" x2="225" y2="0" stroke="#333" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- 起落架 -->
    <line x1="-40" y1="70" x2="-40" y2="90" stroke="#333" stroke-width="3"/>
    <line x1="40" y1="70" x2="40" y2="90" stroke="#333" stroke-width="3"/>
    <line x1="-55" y1="90" x2="55" y2="90" stroke="#333" stroke-width="3"/>
  </g>

  <!-- 升力箭头 -->
  <g stroke="#2ECC71" stroke-width="5" fill="#2ECC71">
    <line x1="450" y1="170" x2="450" y2="100" stroke-linecap="round"/>
    <polygon points="435,100 450,72 465,100"/>
  </g>
  <text x="450" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#2ECC71">升力 ↑</text>

  <!-- 反扭矩说明 - 左侧 -->
  <g transform="translate(60,340)">
    <rect x="0" y="0" width="240" height="180" rx="10" fill="#FFF0F0" stroke="#E74C3C" stroke-width="1.5"/>
    <text x="120" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#E74C3C">反扭矩问题</text>

    <!-- 简化图示 -->
    <g transform="translate(60,70)">
      <circle cx="0" cy="0" r="15" fill="none" stroke="#E74C3C" stroke-width="2"/>
      <path d="M 0,-25 A 25,25 0 0 1 22,12" fill="none" stroke="#E74C3C" stroke-width="2"/>
      <polygon points="20,10 30,18 14,18" fill="#E74C3C"/>
      <text x="0" y="5" text-anchor="middle" font-size="10" fill="#E74C3C">旋翼</text>
    </g>
    <g transform="translate(180,70)">
      <rect x="-15" y="-15" width="30" height="30" fill="none" stroke="#E74C3C" stroke-width="2"/>
      <path d="M -8,-22 A 20,20 0 0 0 15,-8" fill="none" stroke="#E74C3C" stroke-width="2"/>
      <polygon points="17,-10 8,-18 12,-4" fill="#E74C3C"/>
      <text x="0" y="5" text-anchor="middle" font-size="10" fill="#E74C3C">机身</text>
    </g>

    <line x1="90" y1="90" x2="150" y2="90" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="120" y="83" text-anchor="middle" font-size="10" fill="#E74C3C">作用力</text>
    <text x="120" y="115" text-anchor="middle" font-size="12" fill="#555">发动机推旋翼转</text>
    <text x="120" y="135" text-anchor="middle" font-size="12" fill="#555">→ 反作用力使机身反向旋转</text>
    <text x="120" y="158" text-anchor="middle" font-size="11" fill="#E74C3C">必须用尾桨抵消！</text>
  </g>

  <!-- 尾桨说明 - 右下 -->
  <g transform="translate(600,340)">
    <rect x="0" y="0" width="240" height="180" rx="10" fill="#F0FFF4" stroke="#2ECC71" stroke-width="1.5"/>
    <text x="120" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#2ECC71">尾桨解决方案</text>

    <text x="120" y="58" text-anchor="middle" font-size="13" fill="#555">尾桨朝向侧面吹风</text>
    <text x="120" y="78" text-anchor="middle" font-size="13" fill="#555">产生与反扭矩相反的力矩</text>
    <text x="120" y="105" text-anchor="middle" font-size="12" fill="#555">┌────────────────────┐</text>
    <text x="120" y="123" text-anchor="middle" font-size="12" fill="#555">│ 主旋翼力矩 = 尾桨力矩</text>
    <text x="120" y="141" text-anchor="middle" font-size="12" fill="#555">│ → 机身不再旋转</text>
    <text x="120" y="159" text-anchor="middle" font-size="12" fill="#555">└────────────────────┘</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="545" width="780" height="40" rx="8" fill="#EEF2F7"/>
  <text x="450" y="570" text-anchor="middle" font-size="14" fill="#555">旋翼 = 旋转的机翼  |  尾桨 = 抵消反扭矩  |  总距控制升降  |  变距控制方向</text>
</svg>