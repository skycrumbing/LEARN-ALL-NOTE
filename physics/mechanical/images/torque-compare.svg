<svg viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="fcArrow" markerWidth="12" markerHeight="12" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d6336c"/>
    </marker>
  </defs>

  <!-- ============ 左：短扳手 ============ -->
  <text x="140" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#555">短扳手</text>

  <!-- 扳手头 + 螺丝 -->
  <circle cx="70" cy="150" r="22" fill="none" stroke="#b8860b" stroke-width="7"/>
  <circle cx="70" cy="150" r="13" fill="#888" stroke="#333" stroke-width="2"/>

  <!-- 短柄 -->
  <rect x="70" y="139" width="80" height="22" rx="11" fill="#d4a017" stroke="#8b6914" stroke-width="2"/>

  <!-- 力箭头 -->
  <line x1="150" y1="139" x2="150" y2="72" stroke="#d6336c" stroke-width="4" marker-end="url(#fcArrow)"/>
  <text x="150" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6336c">F=50N</text>

  <!-- 力臂标注 -->
  <line x1="70" y1="195" x2="150" y2="195" stroke="#1971c2" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="110" y="213" text-anchor="middle" font-size="13" fill="#1971c2">r = 0.1m</text>

  <!-- 结果 -->
  <text x="140" y="240" text-anchor="middle" font-size="15" fill="#c92a2a">T = 5 N·m 拧不动</text>


  <!-- ============ 右：长扳手 ============ -->
  <text x="460" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#555">长扳手</text>

  <!-- 扳手头 + 螺丝 -->
  <circle cx="380" cy="150" r="22" fill="none" stroke="#b8860b" stroke-width="7"/>
  <circle cx="380" cy="150" r="13" fill="#888" stroke="#333" stroke-width="2"/>

  <!-- 长柄 -->
  <rect x="380" y="139" width="180" height="22" rx="11" fill="#d4a017" stroke="#8b6914" stroke-width="2"/>

  <!-- 力箭头 -->
  <line x1="560" y1="139" x2="560" y2="72" stroke="#d6336c" stroke-width="4" marker-end="url(#fcArrow)"/>
  <text x="560" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6336c">F=50N</text>

  <!-- 力臂标注 -->
  <line x1="380" y1="195" x2="560" y2="195" stroke="#1971c2" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="470" y="213" text-anchor="middle" font-size="13" fill="#1971c2">r = 0.3m</text>

  <!-- 结果 -->
  <text x="460" y="240" text-anchor="middle" font-size="15" fill="#2b8a3e">T = 15 N·m 轻松拧动</text>
</svg>
