<svg viewBox="0 0 440 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- 标题公式 -->
  <text x="220" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">
    扭矩 T = F × r = 50N × 0.3m = 15 N·m
  </text>

  <!-- 扳手头部(套住螺丝的环) -->
  <circle cx="90" cy="160" r="26" fill="none" stroke="#b8860b" stroke-width="8"/>

  <!-- 螺丝(转轴) -->
  <circle cx="90" cy="160" r="14" fill="#888" stroke="#333" stroke-width="2"/>
  <line x1="76" y1="160" x2="104" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="146" x2="90" y2="174" stroke="#333" stroke-width="2"/>
  <text x="90" y="200" text-anchor="middle" font-size="13" fill="#555">螺丝(转轴)</text>

  <!-- 扳手柄 -->
  <rect x="90" y="148" width="240" height="24" rx="12" fill="#d4a017" stroke="#8b6914" stroke-width="2"/>

  <!-- 力箭头(手在柄末端向上用力) -->
  <defs>
    <marker id="forceArrow" markerWidth="12" markerHeight="12" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d6336c"/>
    </marker>
  </defs>
  <line x1="330" y1="148" x2="330" y2="78" stroke="#d6336c" stroke-width="4" marker-end="url(#forceArrow)"/>
  <text x="342" y="92" font-size="16" font-weight="bold" fill="#d6336c">F = 50N</text>
  <text x="342" y="112" font-size="12" fill="#d6336c">(手用力)</text>

  <!-- 力臂虚线(转轴到力作用线的距离) -->
  <defs>
    <marker id="dimArrowL" markerWidth="10" markerHeight="10" refX="0" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#1971c2"/>
    </marker>
    <marker id="dimArrowR" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/>
    </marker>
  </defs>
  <line x1="90" y1="230" x2="330" y2="230" stroke="#1971c2" stroke-width="1.5" stroke-dasharray="6,4" marker-start="url(#dimArrowL)" marker-end="url(#dimArrowR)"/>
  <text x="210" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#1971c2">力臂 r = 0.3m</text>

  <!-- 力臂辅助标注线(从螺丝到力作用点) -->
  <line x1="90" y1="174" x2="90" y2="230" stroke="#1971c2" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="330" y1="148" x2="330" y2="230" stroke="#1971c2" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
