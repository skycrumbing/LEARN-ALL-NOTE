<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="inputGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00b4d8"/>
      <stop offset="1" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="hiddenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4a261"/>
      <stop offset="1" stop-color="#e76f51"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a9d8f"/>
      <stop offset="1" stop-color="#264653"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#fff" font-size="20" font-weight="600">神经网络结构（2-2-1）</text>
  <text x="450" y="60" text-anchor="middle" fill="#8899aa" font-size="12">输入层 → 隐藏层（Sigmoid）→ 输出层（Sigmoid）</text>

  <!-- Layer labels -->
  <text x="140" y="108" text-anchor="middle" fill="#00b4d8" font-size="13" font-weight="600">输入层 Input</text>
  <text x="450" y="108" text-anchor="middle" fill="#f4a261" font-size="13" font-weight="600">隐藏层 Hidden</text>
  <text x="760" y="108" text-anchor="middle" fill="#2a9d8f" font-size="13" font-weight="600">输出层 Output</text>

  <!-- ===== INPUT LAYER ===== -->
  <g filter="url(#shadow)">
    <rect x="100" y="150" width="80" height="60" rx="10" fill="url(#inputGrad)"/>
    <rect x="100" y="310" width="80" height="60" rx="10" fill="url(#inputGrad)"/>
  </g>
  <text x="140" y="175" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">x₁</text>
  <text x="140" y="197" text-anchor="middle" fill="#ccddff" font-size="12">0.5</text>
  <text x="140" y="335" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">x₂</text>
  <text x="140" y="357" text-anchor="middle" fill="#ccddff" font-size="12">-0.3</text>

  <!-- ===== HIDDEN LAYER ===== -->
  <g filter="url(#shadow)">
    <rect x="410" y="150" width="80" height="60" rx="10" fill="url(#hiddenGrad)"/>
    <rect x="410" y="310" width="80" height="60" rx="10" fill="url(#hiddenGrad)"/>
  </g>
  <text x="450" y="172" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">z₁</text>
  <text x="450" y="195" text-anchor="middle" fill="#ffeedd" font-size="11">σ → a₁=0.587</text>
  <text x="450" y="332" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">z₂</text>
  <text x="450" y="355" text-anchor="middle" fill="#ffeedd" font-size="11">σ → a₂=0.579</text>

  <!-- ===== OUTPUT LAYER ===== -->
  <g filter="url(#shadow)">
    <rect x="720" y="220" width="80" height="60" rx="10" fill="url(#outputGrad)"/>
  </g>
  <text x="760" y="245" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">ŷ</text>
  <text x="760" y="267" text-anchor="middle" fill="#ddfffa" font-size="11">σ → 0.490</text>

  <!-- ===== CONNECTIONS: Input → Hidden ===== -->
  <!-- x1→z1: w=0.2 (horizontal top) -->
  <line x1="180" y1="180" x2="410" y2="180" stroke="#4a9eff" stroke-width="2" opacity="0.7"/>
  <!-- x1→z2: w=0.3 (diagonal down) -->
  <line x1="180" y1="195" x2="410" y2="330" stroke="#4a9eff" stroke-width="1.8" opacity="0.6"/>
  <!-- x2→z1: w=-0.5 (diagonal up) -->
  <line x1="180" y1="325" x2="410" y2="185" stroke="#ff6b6b" stroke-width="2" opacity="0.7"/>
  <!-- x2→z2: w=0.1 (horizontal bottom) -->
  <line x1="180" y1="340" x2="410" y2="340" stroke="#4a9eff" stroke-width="1.2" opacity="0.4"/>

  <!-- Weight labels: positioned in clear areas around the connections -->
  <!-- w(x1,z1)=0.2: near top line -->
  <rect x="252" y="160" width="46" height="22" rx="11" fill="#1e2a4a"/>
  <text x="275" y="175" text-anchor="middle" fill="#4a9eff" font-size="12" font-weight="700">0.2</text>
  <!-- w(x1,z2)=0.3: lower-right of the diagonal -->
  <rect x="300" y="275" width="46" height="22" rx="11" fill="#1e2a4a"/>
  <text x="323" y="290" text-anchor="middle" fill="#4a9eff" font-size="12" font-weight="700">0.3</text>
  <!-- w(x2,z1)=-0.5: upper-right of the diagonal -->
  <rect x="252" y="200" width="56" height="22" rx="11" fill="#1e2a4a"/>
  <text x="280" y="215" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="700">-0.5</text>
  <!-- w(x2,z2)=0.1: near bottom line -->
  <rect x="252" y="320" width="46" height="22" rx="11" fill="#1e2a4a"/>
  <text x="275" y="335" text-anchor="middle" fill="#4a9eff" font-size="12" font-weight="700">0.1</text>

  <!-- ===== CONNECTIONS: Hidden → Output ===== -->
  <line x1="490" y1="190" x2="720" y2="240" stroke="#2a9d8f" stroke-width="2" opacity="0.7"/>
  <line x1="490" y1="340" x2="720" y2="260" stroke="#ff6b6b" stroke-width="2" opacity="0.7"/>

  <!-- w(a1,ŷ)=0.4 -->
  <rect x="565" y="195" width="46" height="22" rx="11" fill="#1e2a4a"/>
  <text x="588" y="210" text-anchor="middle" fill="#2a9d8f" font-size="12" font-weight="700">0.4</text>
  <!-- w(a2,ŷ)=-0.3 -->
  <rect x="565" y="305" width="56" height="22" rx="11" fill="#1e2a4a"/>
  <text x="593" y="320" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="700">-0.3</text>

  <!-- ===== BIAS NODES ===== -->
  <g>
    <circle cx="160" cy="420" r="14" fill="#2a2a3e" stroke="#556" stroke-width="1.5"/>
    <text x="160" y="425" text-anchor="middle" fill="#aab" font-size="13" font-weight="600">b</text>
  </g>
  <line x1="174" y1="415" x2="408" y2="185" stroke="#888" stroke-width="1" stroke-dasharray="3,3" opacity="0.35"/>
  <line x1="174" y1="425" x2="408" y2="325" stroke="#888" stroke-width="1" stroke-dasharray="3,3" opacity="0.35"/>
  <text x="250" y="300" fill="#888" font-size="10">b₁=0.1</text>
  <text x="250" y="430" fill="#888" font-size="10">b₂=0.2</text>

  <g>
    <circle cx="470" cy="420" r="14" fill="#2a2a3e" stroke="#556" stroke-width="1.5"/>
    <text x="470" y="425" text-anchor="middle" fill="#aab" font-size="13" font-weight="600">b</text>
  </g>
  <line x1="484" y1="415" x2="718" y2="240" stroke="#888" stroke-width="1" stroke-dasharray="3,3" opacity="0.35"/>
  <text x="560" y="370" fill="#888" font-size="10">b₂=-0.1</text>

  <!-- ===== FORMULA BOX ===== -->
  <g filter="url(#shadow)">
    <rect x="20" y="450" width="860" height="58" rx="8" fill="#1e2a4a" stroke="#334" stroke-width="1"/>
  </g>
  <text x="450" y="473" text-anchor="middle" fill="#aab" font-size="13">
    <tspan>隐藏层: </tspan>
    <tspan fill="#f4a261">z¹</tspan>
    <tspan fill="#aab"> = W¹·x + b¹ → [0.35, 0.32]</tspan>
  </text>
  <text x="450" y="497" text-anchor="middle" fill="#aab" font-size="13">
    <tspan>输出层: </tspan>
    <tspan fill="#2a9d8f">ŷ</tspan>
    <tspan fill="#aab"> = σ(W²·σ(z¹) + b²) = σ([0.4, -0.3]·[0.587, 0.579] - 0.1) ≈ 0.490</tspan>
  </text>

  <!-- ===== Legend ===== -->
  <g transform="translate(620, 395)">
    <rect x="0" y="0" width="260" height="48" rx="6" fill="#1e2a4a" stroke="#334" stroke-width="1"/>
    <text x="130" y="18" text-anchor="middle" fill="#aab" font-size="10" font-weight="600">权重图例</text>
    <line x1="20" y1="35" x2="45" y2="35" stroke="#4a9eff" stroke-width="2"/>
    <text x="50" y="39" fill="#aab" font-size="10">正权重 (w&gt;0)</text>
    <line x1="145" y1="35" x2="170" y2="35" stroke="#ff6b6b" stroke-width="2"/>
    <text x="175" y="39" fill="#aab" font-size="10">负权重 (w&lt;0)</text>
  </g>
</svg>
